<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>VOLTARIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a phone-sized app shell (full screen on phones, framed on desktop) with a fixed bottom tab bar and one scrolling screen area. */
:root{
  --bg:#02060f; --phone:#050d20; --panel:#0b1a38; --panel2:#0e2147; --line:#1b4390; --line-soft:#142e63;
  --text:#e9f1ff; --muted:#8ea5cf; --accent:#1e88ff; --accent-2:#53a8ff;
  --high:#ff4455; --med:#f5b82e; --low:#19d3a2;
  --f-display:'Sora','Segoe UI',system-ui,sans-serif; --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.35;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding-block:14px;padding-inline:0}
.phone{position:relative;width:100%;max-width:400px;height:100%;max-height:860px;background:var(--phone);border:1.5px solid var(--accent);border-radius:28px;box-shadow:0 0 0 1px #0a2a66,0 0 38px rgba(30,136,255,.35);display:flex;flex-direction:column;overflow:hidden}
.status{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-family:var(--f-display);font-size:12px;font-weight:600;flex:none}
.status .sig{display:flex;gap:4px;align-items:center;color:var(--text)}
@media (max-width:480px){.stage{padding-block:0}.phone{max-height:none;border-radius:0;border:0;box-shadow:none}.status{display:none}}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-inline:16px;padding-bottom:18px;scrollbar-width:thin;scrollbar-color:#1b4390 transparent}
.hd{display:flex;align-items:center;gap:8px;padding:10px 0 12px;position:sticky;top:0;background:var(--phone);z-index:5}
.hd h1{font-family:var(--f-display);font-size:19px;font-weight:600;margin:0;letter-spacing:.01em}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text);margin-left:-8px}
.iconbtn:hover{background:var(--panel)}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#06122a;border-top:1px solid var(--line-soft);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;padding:2px 0}
.tab[aria-current="page"]{color:var(--accent-2)}
.tab[aria-current="page"] .ic{filter:drop-shadow(0 0 6px rgba(83,168,255,.8))}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px}
.card.flat{border-color:var(--line-soft)}
.sec{margin-top:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-family:var(--f-display);font-size:13.5px;font-weight:600}
.link{color:var(--accent-2);font-size:12px;font-family:var(--f-body);font-weight:500}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:1 0 auto;min-width:60px;text-align:center;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-2);box-shadow:0 0 14px rgba(30,136,255,.5)}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;padding:11px 0;outline:0;color:var(--text)}
.search:focus-within{border-color:var(--accent-2)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid currentColor;background:color-mix(in srgb,currentColor 16%,transparent)}
.t-high{color:var(--high)}.t-med{color:var(--med)}.t-low{color:var(--low)}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:5px;color:#0a0f1c;white-space:nowrap}
.b-high{background:var(--high);color:#fff}.b-med{background:#d99a14;color:#fff}.b-low{background:#10b98f;color:#04231b}
.badge.soft{color:inherit;background:color-mix(in srgb,currentColor 18%,transparent);border:1px solid color-mix(in srgb,currentColor 55%,transparent)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:8px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line-soft);border-radius:11px}
.row:hover{border-color:var(--accent)}
.row .main{flex:1;min-width:0}
.row .l1{display:flex;align-items:center;gap:8px;font-weight:600}
.row .l2{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-family:var(--f-mono);font-size:14px}
.btn{display:block;width:100%;text-align:center;padding:12px;border-radius:10px;background:var(--accent);font-weight:600;font-family:var(--f-display);font-size:14px;box-shadow:0 0 18px rgba(30,136,255,.45)}
.btn:hover{background:#3796ff}
.btn.ghost{background:transparent;border:1.5px solid var(--accent);box-shadow:none}
.btn.danger{background:#ff3b4e;box-shadow:0 0 18px rgba(255,59,78,.35)}
.btn.sm{display:inline-block;width:auto;padding:5px 12px;font-size:11.5px;border-radius:7px;box-shadow:none}
.btn[disabled]{background:#14305f;box-shadow:none;color:var(--muted);cursor:default}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{text-align:center;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 0 12px rgba(30,136,255,.5)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:9px 10px;display:flex;gap:8px;align-items:center;text-align:left}
.tile b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.1}
.tile small{font-size:10.5px}
.kv{background:var(--panel);border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:11px}
.kv b{font-family:var(--f-mono);font-weight:500;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:6px 6px}
td{padding:8px 6px;border-top:1px solid var(--line-soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(30,136,255,.08)}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:5px;color:#fff;min-width:62px;text-align:center}
.p-critical{background:#ff3b4e}.p-urgent{background:#ff6a3d}.p-high{background:#f08a24}.p-medium{background:#d9a31a;color:#1a1200}.p-low{background:#10b98f;color:#04231b}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:0;appearance:none}
.input:focus{border-color:var(--accent-2)}
.selwrap{position:relative}.selwrap .ic{position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(90deg);pointer-events:none;color:var(--muted)}
.rates{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line-soft);font-size:12.5px}
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12.5px}
.reasons li{display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--high);margin-top:5px;flex:none}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--low);font-size:12px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--low);box-shadow:0 0 8px var(--low)}
.menu{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin-bottom:8px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line-soft);border-radius:11px}
.menu:hover{border-color:var(--accent)}
.menu .mi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#123a80;color:#fff;flex:none}
.menu .tx{flex:1;min-width:0}.menu .tx b{display:block;font-weight:500}.menu .tx small{color:var(--muted);font-size:11.5px}
.switch{width:42px;height:24px;border-radius:999px;background:#1a2f58;position:relative;flex:none;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#9fb6e0;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
details.card{padding:0;margin-bottom:8px}
details summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details[open] summary .ic{transform:rotate(90deg)}
details .body{padding:0 12px 11px;color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);padding:6px 4px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:56px;position:relative}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.05em;margin:6px 0 2px}
.err{color:#ff8a95;font-size:12px;margin-top:6px}
.note{font-size:11px;color:var(--muted);margin-top:8px}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:#0f3a82;border:1px solid var(--accent-2);padding:8px 14px;border-radius:9px;font-size:12.5px;z-index:20;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var P={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 010 6.4M18 14.8c2 .7 3.2 2.4 3.5 5.2"/>',
network:'<circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5l-6 5.5M12 11.5l6 5.5"/>',

/* ---------- sample data (clearly demo data) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var CONS=[
 {id:'C1025',s:85.2,z:1,f:1,t:1,v:5.02,i:0.91,p:4.57},
 {id:'C1047',s:84.7,z:4,f:2,t:3,v:4.96,i:0.88,p:4.36},

 {id:'C1102',s:78.6,z:2,f:3,t:1,v:5.05,i:0.76,p:3.84},
 {id:'C1156',s:72.3,z:5,f:2,t:2,v:5.01,i:0.71,p:3.56},

];
function tier(s){return s>=80?'high':s>=65?'med':'low'}
var TL={high:'High Risk',med:'Medium Risk',low:'Low Risk'};
var TIERNAME={high:'High',med:'Medium',low:'Low'};
function cons(id){for(var i=0;i<CONS.length;i++)if(CONS[i].id===id)return CONS[i];return CONS[0]}
var PRIO={'C1025':'critical','C1047':'critical','C1088':'high','C1102':'high','C1156':'medium','C1189':'medium','C1204':'low','C1230':'low'};
var INSP_PRIO={'C1025':'critical','C1047':'urgent','C1088':'high','C1102':'high','C1156':'medium','C1189':'medium','C1204':'low','C1230':'low'};

 {id:'C1025',lv:'high',tx:'Unusual consumption detected',ago:'2 min ago'},
 {id:'C1102',lv:'med',tx:'Consumption pattern increase',ago:'8 min ago'},
 {id:'C1189',lv:'med',tx:'Consumption pattern deviation',ago:'15 min ago'},
 {id:'C1204',lv:'high',tx:'Tampering risk alert',ago:'1h ago'},
 {id:'C1230',lv:'low',tx:'Meter reading delay',ago:'1h ago'}
];

(function(){
 var pos=[[58,62],[140,48],[236,66],[44,132],[130,120],[214,128],[290,110],[70,200],[160,196],[246,196],[300,176],[110,150]];

 stack:[{screen:'splash',params:{}}],tab:'home',

}

var gid=0;
function chart(data,o){
 o=o||{};var w=o.w||320,h=o.h||130,pl=30,pr=10,pt=10,pb=20,uid='g'+(++gid);
 var mn=o.min!=null?o.min:Math.floor(Math.min.apply(null,data)/10)*10,mx=o.max!=null?o.max:Math.ceil(Math.max.apply(null,data)/10)*10;
 if(mx===mn)mx=mn+10;
 var X=function(i){return pl+(w-pl-pr)*i/(data.length-1)},Y=function(v){return pt+(h-pt-pb)*(1-(v-mn)/(mx-mn))};
 var ticks=o.ticks||4,g='',k;
 for(k=0;k<=ticks;k++){var v=mn+(mx-mn)*k/ticks,y=Y(v);g+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#2a4f94" stroke-opacity=".35" stroke-dasharray="2 4"/><text x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="#8ea5cf" font-family="IBM Plex Mono,monospace">'+(Math.round(v*10)/10)+'</text>'}
 var d='M'+data.map(function(v,i){return X(i).toFixed(1)+' '+Y(v).toFixed(1)}).join(' L');
 var area=d+' L'+X(data.length-1)+' '+(h-pb)+' L'+X(0)+' '+(h-pb)+' Z';
 var xl=(o.xl||[]).map(function(t,i,a){var x=pl+(w-pl-pr)*i/(a.length-1);return '<text x="'+x+'" y="'+(h-4)+'" text-anchor="'+(i===0?'start':i===a.length-1?'end':'middle')+'" font-size="10" fill="#8ea5cf" font-family="IBM Plex Mono,monospace">'+t+'</text>'}).join('');
 var lx=X(data.length-1),ly=Y(data[data.length-1]);
 return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="'+(o.label||'Chart')+'"><defs><linearGradient id="'+uid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e88ff" stop-opacity=".45"/><stop offset="1" stop-color="#1e88ff" stop-opacity="0"/></linearGradient></defs>'+g+'<path d="'+area+'" fill="url(#'+uid+')"/><path d="'+d+'" fill="none" stroke="#53a8ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+lx+'" cy="'+ly+'" r="4" fill="#53a8ff" stroke="#050d20" stroke-width="2"/>'+xl+'</svg>';
}
function history(c,range){
 var n=range==='7'?7:range==='30'?30:12,r=rng(parseInt(c.id.slice(1),10)+n),base=60+c.s*.9,data=[],i;
 for(i=0;i<n;i++){data.push(base-30+i*(range==='7'?6:range==='30'?1.5:5)+r()*28)}
 var xl=[],d=new Date();
 if(range==='3'){xl=['Jul','Aug','Sep','Oct']}
 else{var steps=4,span=range==='7'?6:29;for(i=0;i<=steps;i++){var dd=new Date(d.getTime()-(span-span*i/steps)*864e5);xl.push(dd.toLocaleDateString('en-IN',{day:'numeric',month:'short'}))}}
 return {data:data,xl:xl};
}
function monthsList(){var a=[],d=new Date();for(var i=1;i<=6;i++){var m=new Date(d.getFullYear(),d.getMonth()-i,1);a.push(m.toLocaleDateString('en-IN',{month:'long',year:'numeric'}))}return a}
function money(n){return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function greet(){var h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}

 return header('Live Monitoring')+searchBox('live','Search consumer ID...')+chips('live',['All','High','Medium','Low'])+
 list.map(function(c){var t=tier(c.s),a=ALERTS.filter(function(x){return x.id===c.id})[0],on=c.id===S.live.id;
  return '<button class="row" data-a="livesel" data-id="'+c.id+'" style="'+(on?'border-color:var(--accent-2);box-shadow:0 0 14px rgba(30,136,255,.35)':'')+'">'+avatar(t)+'<span class="main"><span class="l1"><span class="mono">'+c.id+'</span>'+badge(t)+'</span><span class="l2">'+(a?a.tx:'Stable consumption')+'</span></span><span class="muted" style="font-size:11px">'+(a?a.ago:'now')+'</span></button>'}).join('')+
 (list.length?'':'<p class="muted" style="text-align:center;padding:16px 0">No consumers match.</p>')+
 '<div class="card sec"><div class="sec-h"><span>Power (W) <span class="mono muted" style="font-weight:400">'+S.live.id+'</span></span><span class="live">Live</span></div><div id="livechart">'+liveChart()+'</div></div>'+
 '<div style="margin-top:12px"><button class="btn" data-a="detail" data-id="'+S.live.id+'">View Consumer Details</button></div>';
};
function liveChart(){return chart(S.live.data,{min:0,max:10,ticks:5,xl:['0h','6h','12h','24h'],label:'Live power draw',h:130})}
R.alerts=function(){
 var f=S.f.alerts,list=ALERTS.filter(function(a){return f==='all'||a.lv===TFILT[f]});
 return header('Alerts')+chips('alerts',['All','High','Medium','Low'])+
 list.map(function(a){return '<button class="row" data-a="detail" data-id="'+a.id+'">'+avatar(a.lv)+'<span class="main"><span class="l1 mono">'+a.id+'</span><span class="l2" style="color:var(--text)">'+a.tx+'</span><span class="l2">'+a.ago+'</span></span><span class="muted">'+ic('chev',16)+'</span></button>'}).join('')+
 (list.length?'':'<p class="muted" style="text-align:center;padding:24px 0">No alerts at this level.</p>');
};
R.inspections=function(){
 var tab=S.seg.insp;
 var seg='<div class="seg" role="group"><button data-a="seg" data-k="insp" data-v="pending" aria-pressed="'+(tab==='pending')+'">Pending</button><button data-a="seg" data-k="insp" data-v="done" aria-pressed="'+(tab==='done')+'">Completed</button></div>';
 var table;
 if(tab==='pending'){
  table='<div class="card flat" style="padding:4px 6px"><table><thead><tr><th>Consumer ID</th><th>Risk</th><th>Priority</th><th>Action</th></tr></thead><tbody>'+CONS.map(function(c){var p=INSP_PRIO[c.id],as=S.assigned[c.id];return '<tr><td class="mono">'+c.id+'</td><td class="mono">'+c.s.toFixed(1)+'</td><td><span class="pill p-'+p+'">'+p.toUpperCase()+'</span></td><td><button class="btn sm" data-a="assign" data-id="'+c.id+'"'+(as?' disabled':'')+'>'+(as?'Assigned':'Assign')+'</button></td></tr>'}).join('')+'</tbody></table></div>';
 }else{
  table='<div class="card flat" style="padding:4px 6px"><table><thead><tr><th>Consumer ID</th><th>Risk</th><th>Result</th></tr></thead><tbody>'+INSP_DONE.map(function(c){return '<tr><td class="mono">'+c.id+'</td><td class="mono">'+c.risk.toFixed(1)+'</td><td>'+c.res+'</td></tr>'}).join('')+'</tbody></table></div>';
 }
 return header('Inspections')+seg+table;
};
R.more=function(){
 var items=[['clip','Bill Calculation','','calc'],['coins','Currency Calculator','Convert between currencies','currency'],['pulse','Live Monitoring','Real-time system data and alerts','live'],['list','Risk Ranking','Highest-risk consumers first','ranking'],['bell','Alerts','Latest alerts across the network','alerts'],['shield','Inspections','Assign and track field visits','inspections'],['help','Help & Support','FAQs and contact','help'],['gear','Settings','App preferences','settings']];
 return header('More')+items.map(function(i){return '<button class="menu" data-a="'+(i[3]==='calc'?'tab':'go')+'" data-s="'+i[3]+'" data-t="calc"><span class="mi">'+ic(i[0],20)+'</span><span class="tx"><b>'+i[1]+'</b>'+(i[2]?'<small>'+i[2]+'</small>':'')+'</span></button>'}).join('')+
 '<div style="margin-top:14px"><button class="btn danger" data-a="logout">Logout</button></div>';
};
R.currency=function(){
 var c=S.cur,out=(Number(c.amt)||0)*FX[c.to];
 return header('Currency Calculator')+'<div class="card"><div class="field"><label for="c-amt">Amount in ₹ (INR)</label><input class="input mono" id="c-amt" data-in="cur" data-k="amt" type="number" inputmode="decimal" value="'+c.amt+'"></div>'+
 '<div class="field"><label for="c-to">Convert to</label><div class="selwrap"><select class="input" id="c-to" data-in="cursel" data-k="to">'+Object.keys(FX).map(function(k){return '<option'+(k===c.to?' selected':'')+'>'+k+'</option>'}).join('')+'</select>'+ic('chev',16)+'</div></div>'+
 '<div class="kv"><small>Converted</small><b id="curout" style="font-size:22px">'+out.toLocaleString('en-IN',{maximumFractionDigits:2})+' '+c.to+'</b></div><p class="note">Sample exchange rates for this prototype, not live market rates.</p></div>';
};
R.help=function(){
 var q=[['How is the risk score calculated?','Each consumer gets a 0 to 100 score from consumption deviation, time-of-day pattern, meter events and zone loss. 80 and above is High, 65 to 79 is Medium, below 65 is Low.'],['What does Assign do in Inspections?','It marks the consumer as assigned to a field team so the visit appears under your queue.'],['Why is a reading delayed?','Meters report on a schedule. A delayed reading raises a low-level alert until data arrives.'],['How do I change the billing tariff?','Tariffs are fixed by your utility. Open Bill Calculator, then Tariff Info to see the active rates.']];
 return header('Help & Support')+q.map(function(x){return '<details class="card"><summary><b style="font-weight:500">'+x[0]+'</b>'+ic('chev',15)+'</summary><div class="body">'+x[1]+'</div></details>'}).join('')+'<div class="card sec"><div class="muted" style="font-size:12px">Support desk</div><div class="mono" style="margin-top:4px;user-select:all">support@voltaris.demo</div><p class="note">Demo address for this prototype.</p></div>';
};
R.settings=function(){
 var rows=[['push','Push alerts','Notify on new High risk alerts'],['sound','Alert sound','Play a tone for critical alerts'],['auto','Live monitoring updates','Refresh the power chart every 2 seconds']];
 return header('Settings')+rows.map(function(r){return '<div class="menu" style="cursor:default"><span class="tx"><b>'+r[1]+'</b><small>'+r[2]+'</small></span><button class="switch" role="switch" aria-checked="'+S.set[r[0]]+'" aria-label="'+r[1]+'" data-a="toggle" data-k="'+r[0]+'"></button></div>'}).join('');
};

/* ---------- render ---------- */
var lastKey='';
function render(resetScroll){
 var st=top(),scr=$('#screen'),act=document.activeElement,aid=act&&act.id,ss=act&&act.selectionStart;
 var html=(R[st.screen]||R.home)();
 scr.innerHTML=html+(S.toast?'':'');
 var splash=st.screen==='splash'||st.screen==='auth';
 $('#tabbar').style.display=(st.screen==='splash'||st.screen==='auth')?'none':'grid';
 if(!splash){
  $('#tabbar').innerHTML=[['home','Home','home'],['consumers','Consumers','users'],['network','Network','network'],['more','More','more'],['calc','Bill Calculator','calc']].map(function(t){return '<button class="tab" data-a="tab" data-t="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+ic(t[2],22)+'<span>'+t[1]+'</span></button>'}).join('');
 }
 var key=S.stack.length+st.screen+(st.params.id||'');
 if(resetScroll&&key!==lastKey)scr.scrollTop=0;
 lastKey=key;
 if(aid){var el=document.getElementById(aid);if(el&&el.focus){el.focus();try{if(ss!=null)el.setSelectionRange(ss,ss)}catch(e){}}}
 manageLive();
}
function manageLive(){
 var on=top().screen==='live'&&S.set.auto;
 if(on&&!S.liveTimer){S.liveTimer=setInterval(function(){
  var d=S.live.data,last=d[d.length-1],n=Math.min(9.4,Math.max(1.2,last+(Math.random()-.5)*1.1));
  d.push(n);d.shift();var el=$('#livechart');if(el)el.innerHTML=liveChart();
 },2000)}
 if(!on&&S.liveTimer){clearInterval(S.liveTimer);S.liveTimer=null}
}
function toast(msg){
 var old=$('.toast');if(old)old.remove();
 var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;$('#phone').appendChild(t);
 setTimeout(function(){t.remove()},1800);
}

/* ---------- events ---------- */
var A={
 back:function(){back()},
 tab:function(d){tabTo(d.t)},
 go:function(d){go(d.s)},
 detail:function(d){go('detail',{id:d.id})},
 tilego:function(d){S.f.consumers=d.v;S.q.consumers='';tabTo('consumers')},
 chip:function(d){S.f[d.k]=d.v;render()},
 seg:function(d){S.seg[d.k]=d.v;render()},
 range:function(d){S.range=d.v;render()},
 zone:function(d){S.zone=+d.n;render()},
 assign:function(d){S.assigned[d.id]=true;render();toast(d.id+' assigned to a field team')},
 livesel:function(d){S.live.id=d.id;var r=rng(parseInt(d.id.slice(1),10)),b=cons(d.id).p;S.live.data=[];for(var i=0;i<48;i++)S.live.data.push(Math.max(.8,Math.min(9.2,b+Math.sin(i/5)*1.1+(r()-.5)*1.6)));render()},
 toggle:function(d){S.set[d.k]=!S.set[d.k];render()},
 auth:function(d){S.seg.auth=d.m;go('auth')},
 logout:function(){S.stack=[{screen:'splash',params:{}}];S.tab='home';render(true)},
 calc:function(){
  var b=S.bill,units=b.cur-b.prev;
  if(!isFinite(units)||units<0){b.err='Current reading must be higher than the previous reading.';b.result=null;render();return}
  b.err='';var r=RATES[b.type],pk=units*.6,ok=units-pk,pe=pk*r.peak,oe=ok*r.off,du=(pe+oe)*.05;
  b.result={pk:pk,ok:ok,pe:pe,oe:oe,fx:r.fixed,du:du,total:pe+oe+r.fixed+du};render();
  var s=$('#screen');s.scrollTop=s.scrollHeight;
 }
};
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t)return;
 if(t.dataset.a==='signin'){return}
 if(A[t.dataset.a]){A[t.dataset.a](t.dataset,t)}
});
document.addEventListener('keydown',function(e){
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-a],g[data-a]')){e.preventDefault();e.target.click()}
});
document.addEventListener('submit',function(e){
 if(e.target.id==='authform'){e.preventDefault();S.tab='home';S.stack=[{screen:'home',params:{}}];render(true)}
});
document.addEventListener('input',function(e){
 var t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
 if(k==='q'){S.q[t.dataset.k]=t.value;render()}
 else if(k==='bill'){var key=t.dataset.k,v=t.value;S.bill[key]=(key==='prev'||key==='cur')?parseFloat(v):v;
  if(key==='prev'||key==='cur'){var u=S.bill.cur-S.bill.prev;var el=$('#units');if(el)el.textContent=(isFinite(u)?u:0)+' kWh'}}
 else if(k==='cur'){S.cur.amt=t.value;var o=$('#curout');if(o)o.textContent=((Number(t.value)||0)*FX[S.cur.to]).toLocaleString('en-IN',{maximumFractionDigits:2})+' '+S.cur.to}
});
document.addEventListener('change',function(e){
 var t=e.target,k=t.dataset&&t.dataset.in;
 if(k==='billsel'){S.bill[t.dataset.k]=t.dataset.k==='period'?+t.value:t.value;S.bill.result=null;render()}
 else if(k==='cursel'){S.cur.to=t.value;render()}
});
function tick(){var el=$('#clock');if(el){var d=new Date();el.textContent=d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:false})}}
tick();setInterval(tick,30000);
render(true);
})();
</script>
