<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>VOLTARIS</title>
<meta name="theme-color" content="#050a15">
<meta name="description" content="VOLTARIS: Electricity Theft Risk Intelligence">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phone-sized app shell. Inside the app: near-black page with faint neon lightning, every surface (cards, rows, tiles, buttons) in the same sky blue as the login screen. */
:root{
  --bg:#010308; --phone:#05080f; --text:#e8f5ff; --muted:#8db3d4; --line:#1b3550; --line-soft:#14283d;
  --sky:#7cc8f5; --sky-hi:#a8dcfb; --sky-lo:#4fb2ec; --ink:#0a2a52; --ink-2:#1d4d80;
  --panel:#0b1626; --accent:#4cc0ff; --accent-2:#4cc0ff; --accent-soft:rgba(76,192,255,.16); --on-accent:#0a2a52;
  --high:#ff6b7c; --med:#ffbe3d; --low:#35e0b0;
  --high-bg:rgba(255,107,124,.18); --med-bg:rgba(255,190,61,.18); --low-bg:rgba(53,224,176,.16); --p-urgent:#e8590c; --p-high-bg:rgba(255,150,80,.2); --p-high-fg:#ffb27a;
  --grid:rgba(124,200,245,.18); --axis:#8db3d4; --chart:#4cc0ff; --map:#0f2a46; --map-line:#1d4468; --road:#2a5a8a; --water:#17406a;
  --f-display:'Sora','Segoe UI',system-ui,sans-serif; --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.35;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding-block:14px;padding-inline:0}
.phone{position:relative;width:100%;max-width:400px;height:100%;max-height:860px;background:var(--phone);border:1px solid rgba(124,200,245,.3);border-radius:30px;box-shadow:0 0 50px rgba(56,182,255,.16),0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
.bolts{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bolt-lines path{fill:none;stroke:#5cc8ff;stroke-width:1.6;stroke-linejoin:round;opacity:.3;filter:drop-shadow(0 0 4px #38b6ff);animation:flicker 7s infinite}
.bolt-lines path:nth-child(2){animation-delay:2.4s}
.bolt-shapes use{fill:rgba(92,200,255,.07);stroke:#5cc8ff;stroke-width:.25;stroke-linejoin:round}
.bolt-shapes{opacity:.55;filter:drop-shadow(0 0 6px rgba(56,182,255,.6))}
@keyframes flicker{0%,90%,100%{opacity:.3}92%{opacity:.7}94%{opacity:.2}96%{opacity:.6}}
.status,#screen,.tabbar{position:relative;z-index:1}
.status{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-family:var(--f-display);font-size:12px;font-weight:600;flex:none}
.status .sig{display:flex;gap:4px;align-items:center;color:var(--text)}
@media (max-width:480px){.stage{padding-block:0}.phone{max-height:none;border-radius:0;border:0;box-shadow:none}.status{display:none}}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-inline:16px;padding-bottom:18px;scrollbar-width:thin;scrollbar-color:rgba(124,200,245,.35) transparent}
.hd{display:flex;align-items:center;gap:8px;padding:10px 0 12px;position:sticky;top:0;background:rgba(5,8,15,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
.hd h1{font-family:var(--f-display);font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text);margin-left:-8px}
.iconbtn:hover{background:rgba(124,200,245,.15)}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#060a14;border-top:1px solid rgba(124,200,245,.22);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:#7f9fbd;font-size:10.5px;padding:2px 0}
.tab[aria-current="page"]{color:#5cc8ff;font-weight:600}
.tab[aria-current="page"] .ic{filter:drop-shadow(0 0 6px rgba(92,200,255,.8))}

/* dark navy surfaces */
.card,.row,.tile,.kv,.menu{
  color:var(--text);
  background:linear-gradient(180deg,#15324f,#0c1f35);
  border:1px solid rgba(124,200,245,.28);
}
.card{border-radius:14px;padding:12px;box-shadow:0 0 22px rgba(76,192,255,.14)}
.card.flat{box-shadow:none}
.card .kv{background:rgba(124,200,245,.07);border-color:rgba(124,200,245,.2)}
.sec{margin-top:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-family:var(--f-display);font-size:13.5px;font-weight:600}
.link{color:var(--accent);font-size:12px;font-family:var(--f-body);font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:1 0 auto;min-width:60px;text-align:center;padding:7px 12px;border-radius:999px;border:1px solid rgba(124,200,245,.4);background:rgba(124,200,245,.1);font-size:13px;color:var(--text)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--sky-hi),var(--sky));border-color:var(--sky-hi);color:var(--ink);font-weight:600;box-shadow:0 0 14px rgba(92,200,255,.4)}
.search{display:flex;align-items:center;gap:8px;background:#0f2238;border:1px solid rgba(124,200,245,.25);border-radius:11px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;padding:11px 0;outline:0;color:var(--text)}
.search:focus-within{box-shadow:0 0 0 3px rgba(76,192,255,.45)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.7)}
.t-high{color:var(--high)}.t-med{color:var(--med)}.t-low{color:var(--low)}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-high{background:var(--high-bg);color:var(--high)}.b-med{background:var(--med-bg);color:var(--med)}.b-low{background:var(--low-bg);color:var(--low)}
.badge.soft{background:rgba(255,255,255,.7)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:8px;border-radius:13px}
.row:hover{border-color:#fff;box-shadow:0 0 16px rgba(92,200,255,.35)}
.row .main{flex:1;min-width:0}
.row .l1{display:flex;align-items:center;gap:8px;font-weight:600}
.row .l2{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-family:var(--f-mono);font-size:14px;font-weight:500}
.btn{display:block;width:100%;text-align:center;padding:12px;border-radius:11px;background:linear-gradient(180deg,var(--sky-hi),var(--sky-lo));color:var(--ink);font-weight:600;font-family:var(--f-display);font-size:14px;box-shadow:0 0 18px rgba(76,192,255,.35)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--sky-hi);border:1.5px solid var(--sky);box-shadow:none}
.btn.danger{background:#ff3b4e;color:#fff;box-shadow:0 0 18px rgba(255,59,78,.3)}
.btn.sm{display:inline-block;width:auto;padding:5px 12px;font-size:11.5px;border-radius:8px;box-shadow:none}
.card .btn.sm{background:linear-gradient(180deg,var(--sky-hi),var(--sky-lo));color:var(--ink)}
.btn[disabled]{background:rgba(124,200,245,.15);color:var(--muted);cursor:default;filter:none;box-shadow:none}
.card .btn[disabled]{background:rgba(124,200,245,.15);color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(124,200,245,.12);border:1px solid rgba(124,200,245,.25);border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{text-align:center;padding:8px 4px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--sky-hi),var(--sky));color:var(--ink);font-weight:600;box-shadow:0 0 12px rgba(92,200,255,.35)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border-radius:12px;padding:9px 10px;display:flex;gap:8px;align-items:center;text-align:left}
.tile b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.1}
.tile small{font-size:10.5px;font-weight:600}
.kv{border-radius:11px;padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:11px}
.kv b{font-family:var(--f-mono);font-weight:500;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;padding:6px 6px}
td{padding:8px 6px;border-top:1px solid var(--line-soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(124,200,245,.1)}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;min-width:62px;text-align:center}
.p-critical{background:var(--high);color:#fff}.p-urgent{background:var(--p-urgent);color:#fff}.p-high{background:var(--p-high-bg);color:var(--p-high-fg)}.p-medium{background:var(--med-bg);color:var(--med)}.p-low{background:var(--low-bg);color:var(--low)}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.input{width:100%;background:#0f2238;color:var(--text);border:1px solid rgba(124,200,245,.25);border-radius:10px;padding:10px 12px;outline:0;appearance:none}
.input:focus{box-shadow:0 0 0 3px rgba(76,192,255,.45)}
.selwrap{position:relative}.selwrap .ic{position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(90deg);pointer-events:none;color:var(--muted)}
.rates{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line-soft);font-size:12.5px}
.reasons{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12.5px}
.reasons li{display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--high);margin-top:5px;flex:none}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--low);font-size:12px;font-weight:600}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--low)}
.menu{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin-bottom:8px;border-radius:13px}
.menu:hover{border-color:#fff;box-shadow:0 0 16px rgba(92,200,255,.35)}
.menu .mi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.65);color:#0b4a9c;flex:none}
.menu .tx{flex:1;min-width:0}.menu .tx b{display:block;font-weight:500}.menu .tx small{color:var(--muted);font-size:11.5px}
.switch{width:42px;height:24px;border-radius:999px;background:rgba(10,42,82,.25);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:#0b4a9c}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
details.card{padding:0;margin-bottom:8px}
details summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details[open] summary .ic{transform:rotate(90deg)}
details .body{padding:0 12px 11px;color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);padding:6px 4px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.splash{min-height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:56px;position:relative}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.04em;margin:6px 0 2px}
.err{color:var(--high);font-size:12px;margin-top:6px}
.note{font-size:11px;color:var(--muted);margin-top:8px}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:linear-gradient(180deg,#1d4468,#12304f);border:1px solid rgba(124,200,245,.4);color:var(--text);padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600;z-index:20;white-space:nowrap;box-shadow:0 0 18px rgba(92,200,255,.4)}

/* login and sign-in screens: dark navy with glowing bolt */
.phone.sky{background:linear-gradient(180deg,#0f2742 0%,#091526 55%,#050b16 100%)}
.sky .hd{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.sky .btn{background:linear-gradient(180deg,#2c4c70,#1b3554);color:#fff;border:1px solid rgba(168,220,251,.45);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.sky .btn:hover{filter:brightness(1.1)}
.sky .btn.ghost{background:#102640;color:#fff;border:1px solid rgba(168,220,251,.35)}
.sky .note{color:var(--muted)}
.sheet{width:100%;background:linear-gradient(180deg,#15324f,#0c1f35);border-top:1px solid rgba(124,200,245,.35);color:var(--text);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.sheet h2{margin:0;font-family:var(--f-display);font-size:16px}
.sheet .btn{background:#fff;color:#0b4a9c;box-shadow:none}
.sheet .btn.alt{background:rgba(255,255,255,.4)}
.file{width:100%;background:#0f2238;color:var(--text);border-radius:10px;padding:8px;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- labels ---------- */
var TL={high:'High Risk',medium:'Medium Risk',low:'Low Risk'};
var TIERNAME={high:'High',medium:'Medium',low:'Low'};

/* ---------- talking to the server (or the built-in demo) ---------- */
function call(path,opt){
 opt=opt||{};
 if(S.conn==='demo')return new Promise(function(res,rej){try{res(demoApi(path,opt))}catch(e){rej(e)}});
 var h={};if(S.token)h.Authorization='Bearer '+S.token;
 var init={method:opt.method||'GET',headers:h};
 if(opt.body instanceof FormData){init.body=opt.body}
 else if(opt.body){h['Content-Type']='application/json';init.body=JSON.stringify(opt.body)}
 return fetch(API_BASE+path,init).then(function(r){
  return r.json().catch(function(){return {}}).then(function(j){
   if(!r.ok){
    var e=new Error(j.error||('The server returned an error ('+r.status+')'));e.status=r.status;e.loading=!!j.loading;
    if(r.status===401&&S.token&&path.indexOf('/api/auth/')!==0){sessionEnd('Your session ended. Please log in again.')}
    throw e;
   }
   return j;
  });
 },function(){throw new Error('Cannot reach the server. Check your internet connection.')});
}
function sessionEnd(msg){
 S.token=null;S.user=null;keep('voltaris.token',null);keep('voltaris.user',null);S.d={};
 S.stack=[{screen:'splash',params:{}}];S.authErr=msg||'';render(true);
}
function need(key,path){
 var e=S.d[key];
 if(e&&e.path===path)return e;
 e=S.d[key]={path:path,loading:true,data:null,error:null};
 call(path).then(function(j){if(S.d[key]!==e)return;e.data=j;e.loading=false;render()})
 .catch(function(err){
  if(S.d[key]!==e)return;
  e.loading=false;e.error=err.message;
  if(err.loading){setTimeout(function(){if(S.d[key]===e){delete S.d[key];render()}},3000)}
  render();
 });
 return e;
}
function view(e,fn){
 if(e.error&&!e.data)return '<div class="card"><b>Could not load this screen</b><p class="note">'+esc(e.error)+'</p><button class="btn sm" data-a="retry">Try again</button></div>';
 if(!e.data)return '<div class="loading">Loading…</div>';
 return fn(e.data);
}
function timeoutFetch(url,ms){
 return new Promise(function(res,rej){
  var done=false,ctl=window.AbortController?new AbortController():null;
  var t=setTimeout(function(){if(!done){done=true;if(ctl)ctl.abort();rej(new Error('timeout'))}},ms);
  fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){return r.json()}).then(function(j){if(!done){done=true;clearTimeout(t);res(j)}}).catch(function(e){if(!done){done=true;clearTimeout(t);rej(e)}});
 });
}
function checkServer(){
 var explicit=!!API_BASE,tries=explicit?7:1;
 function attempt(n){
  return timeoutFetch(API_BASE+'/api/health',explicit?12000:4000).then(function(j){
   if(!j||j.ok!==true)throw new Error('not voltaris');
   S.health=j;return 'api';
  }).catch(function(){
   if(n<tries-1){S.connNote='Waking up the server. This can take up to a minute.';render();return attempt(n+1)}
   return explicit?'error':'demo';
  });
 }
 return attempt(0);
}
var connP=null;
function boot(){
 S.conn='connecting';S.connNote='';render();
 connP=checkServer().then(function(mode){
  S.conn=mode;
  if(mode==='api'){
   if(S.health&&S.health.ready===false)pollReady();
   var tok=recall('voltaris.token'),usr=recall('voltaris.user');
   if(tok){
    S.token=tok;
    return call('/api/auth/me').then(function(j){S.user=j.user;S.tab='home';S.stack=[{screen:'home',params:{}}];render(true)})
     .catch(function(){S.token=null;keep('voltaris.token',null);keep('voltaris.user',null);render()});
   }
  }
  render();
 });
}
function pollReady(){
 setTimeout(function(){
  timeoutFetch(API_BASE+'/api/health',8000).then(function(j){S.health=j;if(j.ready===false)pollReady();else{clearData();render()}}).catch(function(){pollReady()});
 },3000);
}

function niceMax(v){if(!(v>0))return 10;var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)),m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}

var gid=0;
function chart(data,o){
 o=o||{};var w=o.w||320,h=o.h||130,pl=38,pr=10,pt=10,pb=20,uid='g'+(++gid);
 var mn=o.min!=null?o.min:0,mx=o.max!=null?o.max:10;
 if(mx===mn)mx=mn+10;
 var X=function(i){return pl+(w-pl-pr)*i/(data.length-1)},Y=function(v){return pt+(h-pt-pb)*(1-(v-mn)/(mx-mn))};
 var ticks=o.ticks||4,g='',k;
 for(k=0;k<=ticks;k++){var v=mn+(mx-mn)*k/ticks,y=Y(v);g+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--grid)" stroke-dasharray="2 4"/><text x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" style="fill:var(--axis)" font-family="IBM Plex Mono,monospace">'+(Math.round(v*10)/10)+'</text>'}
 var d='M'+data.map(function(v,i){return X(i).toFixed(1)+' '+Y(v).toFixed(1)}).join(' L');
 var area=d+' L'+X(data.length-1)+' '+(h-pb)+' L'+X(0)+' '+(h-pb)+' Z';
 var xl=(o.xl||[]).map(function(t,i,a){var x=pl+(w-pl-pr)*i/Math.max(a.length-1,1);return '<text x="'+x+'" y="'+(h-4)+'" text-anchor="'+(i===0?'start':i===a.length-1?'end':'middle')+'" font-size="10" style="fill:var(--axis)" font-family="IBM Plex Mono,monospace">'+esc(t)+'</text>'}).join('');
 var lx=X(data.length-1),ly=Y(data[data.length-1]);
 return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="'+esc(o.label||'Chart')+'"><defs><linearGradient id="'+uid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--chart)" stop-opacity=".22"/><stop offset="1" style="stop-color:var(--chart)" stop-opacity="0"/></linearGradient></defs>'+g+'<path d="'+area+'" fill="url(#'+uid+')"/><path d="'+d+'" fill="none" style="stroke:var(--chart)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+lx+'" cy="'+ly+'" r="4" style="fill:var(--chart);stroke:var(--panel)" stroke-width="2.5"/>'+xl+'</svg>';
}
function usageChart(c,label){
 var vals=c.series.values.map(function(v){return v==null?0:v}),dates=c.series.dates;
 var n=S.range==='all'?vals.length:Math.min(+S.range,vals.length);
 vals=vals.slice(-n);dates=dates.slice(-n);
 if(n<2)return '<p class="note">Not enough days of data to draw a chart.</p>';
 var xl=[],k=Math.min(4,n),i;
 for(i=0;i<k;i++){xl.push(fmtDay(dates[Math.round(i*(n-1)/Math.max(k-1,1))]))}
 var mx=niceMax(Math.max.apply(null,vals));
 return chart(vals,{min:0,max:mx,ticks:5,xl:xl,label:label});
}

  }else if(S.conn==='demo')html+='<div class="card sec"><p class="note">Uploads need a connected server. This is demo data.</p></div>';

  if(j.history&&j.history.length>1)html+='<div class="card sec"><div class="sec-h"><span>Earlier datasets</span></div>'+j.history.map(function(h,i){return '<div class="rates"'+(i===0?' style="border-top:0"':'')+'><span>'+esc(h.name)+(h.active?' (current)':'')+'</span><span class="muted">'+num(h.rows)+' · '+esc(String(h.end_date))+'</span></div>'}).join('')+'</div>';
  return html;
 });
};

/* ---------- render ---------- */
var lastKey='';
function sheetHtml(){
 if(!S.sheet)return '';
 return '<div class="scrim" data-a="sheetclose"><div class="sheet" role="dialog" aria-label="Complete inspection"><h2>Complete inspection '+esc(S.sheet.id)+'</h2><p class="note" style="margin:0">What did the field team find?</p>'+
 '<button class="btn" data-a="sheetpick" data-r="theft_confirmed">Theft confirmed</button><button class="btn" data-a="sheetpick" data-r="meter_fault">Meter fault</button><button class="btn" data-a="sheetpick" data-r="no_issue">No issue found</button><button class="btn alt" data-a="sheetclose">Cancel</button></div></div>';
}
function render(resetScroll){
 var st=top(),scr=$('#screen'),act=document.activeElement,aid=act&&act.id,ss=act&&act.selectionStart;
 var prevTop=scr.scrollTop;
 scr.innerHTML=(R[st.screen]||R.home)();
 var old=$('.scrim');if(old)old.remove();
 if(S.sheet)$('#phone').insertAdjacentHTML('beforeend',sheetHtml());
 var splash=st.screen==='splash'||st.screen==='auth';
 $('#phone').classList.toggle('sky',splash);
 $('#tabbar').style.display=splash?'none':'grid';
 if(!splash){
  $('#tabbar').innerHTML=[['home','Home','home'],['consumers','Consumers','users'],['network','Network','network'],['more','More','more'],['calc','Bill Calculator','calc']].map(function(t){return '<button class="tab" data-a="tab" data-t="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+ic(t[2],22)+'<span>'+t[1]+'</span></button>'}).join('');
 }
 var key=S.stack.length+st.screen+(st.params.id||'');
 if(resetScroll&&key!==lastKey)scr.scrollTop=0;else scr.scrollTop=prevTop;
 lastKey=key;
 if(aid){var el=document.getElementById(aid);if(el&&el.focus){el.focus();try{if(ss!=null)el.setSelectionRange(ss,ss)}catch(e){}}}
}
function toast(msg){
 var old=$('.toast');if(old)old.remove();
 var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;$('#phone').appendChild(t);
 setTimeout(function(){t.remove()},2200);
}
function startPoll(){
 if(S.polling||S.conn!=='api')return;
 S.polling=true;
 (function tick(){
  call('/api/dataset').then(function(j){
   S.d.dataset={path:'/api/dataset',loading:false,data:j,error:null};
   if(j.job.state==='running'){setTimeout(tick,1500)}
   else{S.polling=false;S.upBusy=false;if(j.job.state==='done'){clearData(['dataset']);toast('New data is loaded')}else if(j.job.state==='error'){toast('Upload failed')}}
   render();
  }).catch(function(){S.polling=false;S.upBusy=false;render()});
 })();
}
function doAuth(){
 var create=S.seg.auth==='create',email=($('#a-mail')||{}).value||'',pw=($('#a-pass')||{}).value||'',name=create?(($('#a-name')||{}).value||''):'';
 email=email.trim();
 if(!email||!pw){S.authErr='Enter your email and password.';render();return}
 if(create&&pw.length<8){S.authErr='Use a password with at least 8 characters.';render();return}
 S.authBusy=true;S.authErr='';render();
 (connP||Promise.resolve()).then(function(){
  return call(create?'/api/auth/register':'/api/auth/login',{method:'POST',body:{name:name.trim(),email:email,password:pw}});
 }).then(function(j){
  S.token=j.token;S.user=j.user;S.authBusy=false;S.authErr='';clearData();
  if(S.conn==='api'){keep('voltaris.token',j.token);keep('voltaris.user',JSON.stringify(j.user))}
  S.tab='home';S.stack=[{screen:'home',params:{}}];render(true);
 }).catch(function(err){S.authBusy=false;S.authErr=err.message;render()});
}

/* ---------- events ---------- */
var qTimer=null;
var A={
 back:function(){back()},
 tab:function(d){tabTo(d.t)},
 go:function(d){go(d.s)},
 detail:function(d){go('detail',{id:d.id})},
 tilego:function(d){S.f.consumers=d.v;S.q.consumers='';S.more.consumers=50;tabTo('consumers')},
 chip:function(d){S.f[d.k]=d.v;if(S.more[d.k])S.more[d.k]=50;render()},
 more:function(d){S.more[d.k]=Math.min(200,S.more[d.k]+50);render()},
 seg:function(d){S.seg[d.k]=d.v;render()},
 range:function(d){S.range=d.v;render()},
 zone:function(d){S.zone=+d.n;render()},
 viewnet:function(d){S.zone=+d.z;S.seg.map='map';tabTo('network')},
 retry:function(){clearData();render()},
 reload:function(){clearData();render();toast('Reloading data')},
 retryconn:function(){boot()},
 demo:function(){S.conn='demo';connP=Promise.resolve();render()},
 livesel:function(d){S.live.id=d.id;render()},
 auth:function(d){S.seg.auth=d.m;S.authErr='';go('auth')},
 logout:function(){
  S.token=null;S.user=null;keep('voltaris.token',null);keep('voltaris.user',null);clearData();S.authErr='';S.stack=[{screen:'splash',params:{}}];S.tab='home';render(true);
 },
 assign:function(d){
  call('/api/inspections/'+encodeURIComponent(d.id)+'/assign',{method:'POST'}).then(function(){
   var k;for(k in S.d){if(k.indexOf('insp:')===0)delete S.d[k]}
   render();toast(d.id+' assigned for inspection');
  }).catch(function(e){toast(e.message)});
 },
 complete:function(d){S.sheet={id:d.id};render()},
 sheetclose:function(d,el,ev){if(ev&&ev.target!==el&&el.classList.contains('scrim'))return;S.sheet=null;render()},
 sheetpick:function(d){
  var id=S.sheet&&S.sheet.id;if(!id)return;
  call('/api/inspections/'+encodeURIComponent(id)+'/complete',{method:'POST',body:{result:d.r}}).then(function(){
   S.sheet=null;var k;for(k in S.d){if(k.indexOf('insp:')===0)delete S.d[k]}
   render();toast('Inspection recorded');
  }).catch(function(e){S.sheet=null;render();toast(e.message)});
 },
 upload:function(){
  var f=$('#up-file'),file=f&&f.files&&f.files[0];
  if(!file){toast('Choose a CSV file first');return}
  var fd=new FormData();fd.append('file',file);fd.append('train',($('#up-train')||{}).value||'auto');
  S.upBusy=true;render();
  call('/api/dataset',{method:'POST',body:fd}).then(function(){S.polling=false;startPoll()}).catch(function(e){S.upBusy=false;render();toast(e.message)});
 },
 calc:function(){
  var b=S.bill,units=b.cur-b.prev;
  if(!isFinite(units)||units<0){b.err='Current reading must be higher than the previous reading.';b.result=null;render();return}
  b.err='';var r=RATES[b.type],pk=units*.6,ok=units-pk,pe=pk*r.peak,oe=ok*r.off,du=(pe+oe)*.05;
  b.result={pk:pk,ok:ok,pe:pe,oe:oe,fx:r.fixed,du:du,total:pe+oe+r.fixed+du};render();
  var s=$('#screen');s.scrollTop=s.scrollHeight;
 }
};
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t)return;
 if(t.dataset.a==='signin')return;
 if(A[t.dataset.a])A[t.dataset.a](t.dataset,t,e);
});
document.addEventListener('keydown',function(e){
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-a],g[data-a]')){e.preventDefault();e.target.click()}
 if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}
});
document.addEventListener('submit',function(e){if(e.target.id==='authform'){e.preventDefault();doAuth()}});
document.addEventListener('input',function(e){
 var t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
 if(k==='q'){S.q[t.dataset.k]=t.value;if(S.more[t.dataset.k])S.more[t.dataset.k]=50;clearTimeout(qTimer);qTimer=setTimeout(function(){render()},250)}
 else if(k==='af'){S.af[t.dataset.k]=t.value}
 else if(k==='bill'){var key=t.dataset.k,v=t.value;S.bill[key]=(key==='prev'||key==='cur')?parseFloat(v):v;
  if(key==='prev'||key==='cur'){var u=S.bill.cur-S.bill.prev;var el=$('#units');if(el)el.textContent=(isFinite(u)?u:0)+' kWh'}}
 else if(k==='cur'){S.cur.amt=t.value;var o=$('#curout');if(o)o.textContent=((Number(t.value)||0)*FX[S.cur.to]).toLocaleString('en-IN',{maximumFractionDigits:2})+' '+S.cur.to}
});
document.addEventListener('change',function(e){
 var t=e.target,k=t.dataset&&t.dataset.in;
 if(k==='billsel'){S.bill[t.dataset.k]=t.dataset.k==='period'?+t.value:t.value;S.bill.result=null;render()}
 else if(k==='cursel'){S.cur.to=t.value;render()}
});

/* ---------- built-in demo data (used only when no server is found) ---------- */
var DEMO=null;
function demoInit(){
 if(DEMO)return DEMO;
 var r=rng(11),hex='0123456789ABCDEF',n=300,items=[],seen={},dates=[],i,j,k;
 for(i=0;i<26;i++)dates.push(new Date(Date.UTC(2014,0,1+i)).toISOString().slice(0,10));
 for(k=0;k<n;k++){
  var sc=k<10?72+r()*18:k<45?50+r()*20:k<120?30+r()*20:r()*30;sc=Math.round(sc*10)/10;
  var id;do{id='';for(j=0;j<8;j++)id+=hex[Math.floor(r()*16)]}while(seen[id]);seen[id]=1;
  var base=3+r()*10,ser=[],zone=1+Math.floor(r()*12),fl=1+Math.floor(r()*4),tl=1+Math.floor(r()*8);
  for(j=0;j<26;j++){var v=base*(0.8+r()*0.4);if(sc>=50&&j>=13)v*=0.15+r()*0.3;if(sc>=70&&j>=22)v=0;ser.push(Math.round(v*100)/100)}
  var feeder=(zone-1)*4+fl;
  items.push({id:id,score:sc,tier:tierOf(sc),priority:priorityOf(sc),zone:zone,feeder:feeder,transformer:(feeder-1)*8+tl,series:ser});
 }
 items.sort(function(a,b){return b.score-a.score});
 items.forEach(function(c){
  var mean=0,pk=0,zd=0;c.series.forEach(function(v){mean+=v;if(v>pk)pk=v;if(v===0)zd++});mean/=26;
  var h1=0,h2=0;for(j=0;j<13;j++){h1+=c.series[j];h2+=c.series[13+j]}
  c.stats={last_kwh:c.series[25],mean_kwh:Math.round(mean*100)/100,peak_kwh:pk,zero_days:zd,days:26};
  var rs=[];if(h1>0&&h2/h1<0.6)rs.push('Usage fell '+Math.round((1-h2/h1)*100)+'% from the first half to the second half of the period');
  if(zd>=1)rs.push('Zero reading on '+zd+' of 26 days');
  if(!rs.length)rs.push('Usage pattern is close to the typical range');
  c.reasons=rs;
 });
 var alerts=items.filter(function(c){return c.tier!=='low'}).slice(0,40).map(function(c,i){return {id:c.id,level:c.tier,text:['Sudden drop in consumption','Zero reading on the latest day','Consumption pattern deviation (usage falling)','Pattern similar to confirmed theft cases'][i%4],when:'26 Jan 2014',score:c.score}});
 DEMO={items:items,dates:dates,alerts:alerts,assigned:{},done:[]};
 return DEMO;
}
function demoApi(path,opt){
 var D=demoInit(),u=path.split('?'),p=u[0],q=new URLSearchParams(u[1]||''),m=opt.method||'GET',body=opt.body||{};
 var lim=Math.min(200,parseInt(q.get('limit')||'50',10)||50);
 function filt(){var t=q.get('tier'),s=(q.get('q')||'').toUpperCase();return D.items.filter(function(c){return(!t||c.tier===t)&&(!s||c.id.indexOf(s)>-1)})}
 function slim(c,rank){var o={id:c.id,score:c.score,tier:c.tier,priority:c.priority,zone:c.zone,feeder:c.feeder,transformer:c.transformer};if(rank)o.rank=rank;return o}
 var mm;
 if(p==='/api/auth/login'||p==='/api/auth/register'){if(!body.email||!body.password)throw new Error('Enter your email and password');return {token:'demo',user:{name:body.name||String(body.email).split('@')[0],email:body.email,role:'admin'}}}
 if(p==='/api/auth/me')return {user:S.user};
 if(p==='/api/summary'){var cnt={high:0,medium:0,low:0};D.items.forEach(function(c){cnt[c.tier]++});return {total:D.items.length,counts:cnt,top_high:D.items.filter(function(c){return c.tier==='high'}).slice(0,3).map(function(c){return slim(c)}),alerts:D.alerts.slice(0,2),network:{zones:12,feeders:48,transformers:384},data_date:'2014-01-26',dataset:{name:'Demo sample',days:26,mode:'rules',start_date:'2014-01-01',end_date:'2014-01-26'}}}
 if(p==='/api/consumers'){var f=filt();return {total:f.length,items:f.slice(0,lim).map(function(c){return slim(c)})}}
 if(p==='/api/ranking'){var f2=filt();return {total:f2.length,items:f2.slice(0,lim).map(function(c){return slim(c,D.items.indexOf(c)+1)})}}
 if((mm=p.match(/^\/api\/consumers\/([A-Za-z0-9]+)$/))){var c=D.items.filter(function(x){return x.id===mm[1].toUpperCase()})[0];if(!c)throw new Error('Consumer not found');var o=slim(c,D.items.indexOf(c)+1);o.reasons=c.reasons;o.stats=c.stats;o.series={dates:D.dates,values:c.series};o.label=null;o.total=D.items.length;o.data_date='2014-01-26';return o}
 if(p==='/api/zones'){var zs=[],z;for(z=1;z<=12;z++){var inz=D.items.filter(function(c){return c.zone===z}),fs={};inz.forEach(function(c){(fs[c.feeder]=fs[c.feeder]||[]).push(c)});
   var hh=inz.filter(function(c){return c.tier==='high'}).length,mmed=inz.filter(function(c){return c.tier==='medium'}).length;
   zs.push({zone:z,consumers:inz.length,share_pct:Math.round(1000*inz.length/D.items.length)/10,high:hh,medium:mmed,low:inz.length-hh-mmed,high_pct:100*hh/Math.max(inz.length,1),medium_pct:100*mmed/Math.max(inz.length,1),transformers:Object.keys(fs).length*2,feeders:Object.keys(fs).map(function(k){return {feeder:+k,consumers:fs[k].length,high:0,transformers:2}})})}
  var rk=zs.slice().sort(function(a,b){return (b.high_pct*2+b.medium_pct)-(a.high_pct*2+a.medium_pct)});rk.forEach(function(zz,i){zz.risk=i<4?'high':i<8?'medium':'low'});return {zones:zs,total:D.items.length,estimated:true}}
 if(p==='/api/alerts'){var lv=q.get('level');return {items:D.alerts.filter(function(a){return!lv||a.level===lv}).slice(0,lim)}}
 if(p==='/api/inspections'&&m==='GET'){if(q.get('status')==='done')return {items:D.done};return {items:D.items.filter(function(c){return c.tier==='high'&&!D.done.some(function(d){return d.id===c.id})}).slice(0,lim).map(function(c){return {id:c.id,score:c.score,tier:c.tier,priority:c.priority,assigned:!!D.assigned[c.id]}})}}
 if((mm=p.match(/^\/api\/inspections\/([A-Za-z0-9]+)\/(assign|complete)$/))){var cid=mm[1].toUpperCase();if(mm[2]==='assign'){D.assigned[cid]=true}else{var cc=D.items.filter(function(x){return x.id===cid})[0];delete D.assigned[cid];D.done.unshift({id:cid,score:cc?cc.score:0,result:body.result,note:'',completed_at:new Date().toISOString()})}return {ok:true}}
 if(p==='/api/dataset'){return {dataset:{name:'Demo sample',rows:D.items.length,days:26,start_date:'2014-01-01',end_date:'2014-01-26',mode:'rules',has_labels:false,metrics:null,metrics_source:'none',loaded_at:new Date().toISOString(),real_network:false},history:[],job:{state:'idle',message:''},role:'admin'}}
 throw new Error('Not available in demo mode');
}

function tick(){var el=$('#clock');if(el){var d=new Date();el.textContent=d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:false})}}
tick();setInterval(tick,30000);
boot();
})();
</script>
